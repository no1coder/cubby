<div style="width: 900px; height: 920px; box-sizing: border-box; padding: 30px; position: relative; overflow: hidden; background: #0d1222; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; color: rgba(255,255,255,0.94); -webkit-font-smoothing: antialiased">

    <aside style="width: 200px; flex: none; padding: 44px 10px 10px; background: rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; background: #0A84FF; color: #fff"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="9" cy="9" r="2.4"></circle><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4"></path></svg>通用</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>历史</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"><path d="M2 6V3.5A1.5 1.5 0 0 1 3.5 2H6M12 2h2.5A1.5 1.5 0 0 1 16 3.5V6M16 12v2.5a1.5 1.5 0 0 1-1.5 1.5H12M6 16H3.5A1.5 1.5 0 0 1 2 14.5V12"></path><circle cx="9" cy="9" r="2.6"></circle></svg>截图与标注</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h6M5 2v1.5M3.2 3.5c.4 2.5 2 4.3 4.3 5M6.8 3.5C6.4 6 4.6 7.9 2.2 8.8M8.5 14l2.8-6.5L14 14M9.4 12h3.8"></path></svg>翻译</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5l5.5 2v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z"></path><path d="M5.6 8l1.7 1.7 3.2-3.2" stroke-linecap="round"></path></svg>剪贴板安全</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7.5" rx="1.6"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>隐私</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 7.2v4M8 4.8v.1"></path></svg>关于</div>

    <main style="flex: 1; min-width: 0; padding: 22px 28px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">

      <h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6)">外观</h2>
      <div style="border-radius: 10px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.07); padding: 12px 14px 12px">
        <div role="radiogroup" aria-label="外观" style="display: flex; gap: 18px">
          <button role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0; border: 0; background: transparent; color: #fff; font: 600 12px -apple-system, 'PingFang SC', sans-serif">
            <span aria-hidden="true" style="position: relative; display: flex; width: 104px; height: 66px; border-radius: 9px; overflow: hidden; box-shadow: 0 0 0 2px #0A84FF, 0 0 0 5px rgba(10,132,255,0.25)">

              <span style="flex: 1; background: #1b2033; position: relative"><span style="position: absolute; left: 6px; top: 10px; width: 36px; height: 46px; border-radius: 6px; background: rgba(60,62,76,0.95); box-shadow: 0 2px 6px rgba(0,0,0,0.4)"></span></span>
            </span>跟随系统</button>

            <span aria-hidden="true" style="position: relative; width: 104px; height: 66px; border-radius: 9px; background: #dfe4f2; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15)"><span style="position: absolute; left: 34px; top: 10px; width: 36px; height: 46px; border-radius: 6px; background: rgba(255,255,255,0.9); box-shadow: 0 2px 6px rgba(30,40,90,0.15)"></span></span>浅色</button>
          <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.75); font: 12px -apple-system, 'PingFang SC', sans-serif">
            <span aria-hidden="true" style="position: relative; width: 104px; height: 66px; border-radius: 9px; background: #1b2033; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15)"><span style="position: absolute; left: 34px; top: 10px; width: 36px; height: 46px; border-radius: 6px; background: rgba(60,62,76,0.95); box-shadow: 0 2px 6px rgba(0,0,0,0.4)"></span></span>深色</button>
        </div>
      </div>
      <p style="margin: 0 4px 6px; font-size: 11px; color: rgba(255,255,255,0.55)">作用于面板、预览、晾衣绳与设置窗口；「跟随系统」时随 macOS 外观自动切换。</p>

      <h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6)">快捷键与面板</h2>
      <div style="border-radius: 10px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.07)">
        <div style="display: flex; align-items: center; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">打开面板<span style="margin-left: auto; padding: 3px 10px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.12); font-size: 12px; letter-spacing: 1px">⇧⌘V</span></div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">
          <div style="display: flex; flex-direction: column; gap: 2px">只看图片<span style="font-size: 11px; color: rgba(255,255,255,0.55)">直接打开图片网格</span></div>
          <span style="margin-left: auto; padding: 3px 10px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.12); font-size: 12px; letter-spacing: 1px">⌃⇧V</span>
          <button style="height: 22px; padding: 0 10px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); font: 12px -apple-system, 'PingFang SC', sans-serif">关闭</button>
        </div>
        <div style="padding: 10px 14px 14px; font-size: 13px">
          <div style="margin-bottom: 10px">面板位置</div>
          <div role="radiogroup" aria-label="面板位置" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
            <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.75); font: 11px -apple-system, 'PingFang SC', sans-serif">
              <span style="position: relative; width: 100%; height: 62px; border-radius: 7px; background: #2b3346; border: 0.5px solid rgba(255,255,255,0.12)"><span style="position: absolute; left: 38%; top: 14px; width: 22px; height: 34px; border-radius: 4px; background: rgba(255,255,255,0.75)"></span><span style="position: absolute; left: 30%; top: 10px; width: 6px; height: 6px; border-radius: 1px; background: #fff; transform: rotate(-20deg)"></span></span>鼠标旁</button>
            <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.75); font: 11px -apple-system, 'PingFang SC', sans-serif">
              <span style="position: relative; width: 100%; height: 62px; border-radius: 7px; background: #2b3346; border: 0.5px solid rgba(255,255,255,0.12)"><span style="position: absolute; left: 0; right: 0; top: 0; height: 6px; background: rgba(255,255,255,0.18); border-radius: 7px 7px 0 0"></span><span style="position: absolute; right: 16px; top: 9px; width: 22px; height: 34px; border-radius: 4px; background: rgba(255,255,255,0.75)"></span></span>菜单栏图标下</button>
            <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.75); font: 11px -apple-system, 'PingFang SC', sans-serif">
              <span style="position: relative; width: 100%; height: 62px; border-radius: 7px; background: #2b3346; border: 0.5px solid rgba(255,255,255,0.12)"><span style="position: absolute; left: 50%; top: 12px; width: 22px; height: 36px; margin-left: -11px; border-radius: 4px; background: rgba(255,255,255,0.75)"></span></span>屏幕中央</button>
            <button role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #fff; font: 600 11px -apple-system, 'PingFang SC', sans-serif">
              <span style="position: relative; width: 100%; height: 62px; border-radius: 7px; background: #2b3346; box-shadow: 0 0 0 2px #0A84FF"><span style="position: absolute; right: 3px; top: 3px; bottom: 3px; width: 20px; border-radius: 4px; background: rgba(255,255,255,0.85)"></span></span>固定右侧</button>
            <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: rgba(255,255,255,0.75); font: 11px -apple-system, 'PingFang SC', sans-serif">
              <span style="position: relative; width: 100%; height: 62px; border-radius: 7px; background: #2b3346; border: 0.5px solid rgba(255,255,255,0.12)"><span style="position: absolute; left: 3px; right: 3px; bottom: 3px; height: 18px; border-radius: 4px; background: rgba(255,255,255,0.75)"></span></span>固定底部</button>
          </div>
        </div>
      </div>
      <p style="margin: 0 4px 6px; font-size: 11px; color: rgba(255,255,255,0.55)">面板顶栏的布局按钮可随时在浮动、右侧、底部之间切换。</p>

      <h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6)">晾衣绳</h2>
      <div style="border-radius: 10px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.07)">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">
          <div style="display: flex; flex-direction: column; gap: 2px">在屏幕顶部晾图片<span style="font-size: 11px; color: rgba(255,255,255,0.55)">在面板里对图片按 ⌘L 挂上去；指针停在屏幕顶边时绳子滑下来</span></div>
          <label style="margin-left: auto; position: relative; width: 38px; height: 22px; flex: none"><input type="checkbox" checked aria-label="在屏幕顶部晾图片" style="position: absolute; inset: 0; opacity: 0; margin: 0"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 11px; background: #0A84FF"></span><span aria-hidden="true" style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3)"></span></label>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">显示 / 收起<span style="margin-left: auto; padding: 3px 10px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.12); font-size: 12px; letter-spacing: 1px">⌃⌥T</span><button style="height: 22px; padding: 0 10px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); font: 12px -apple-system, 'PingFang SC', sans-serif">关闭</button></div>
        <div style="display: flex; align-items: center; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">指针停在顶边多久后滑下
          <select aria-label="停留时间" style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; font: 12px -apple-system, 'PingFang SC', sans-serif"><option>0.5 秒</option></select></div>
        <div style="display: flex; align-items: center; padding: 9px 14px; font-size: 13px">绳上的图片<span style="margin-left: auto; color: rgba(255,255,255,0.55); font-size: 12px">4 / 12 张</span><button style="margin-left: 10px; height: 22px; padding: 0 10px; border: 0; border-radius: 6px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); font: 12px -apple-system, 'PingFang SC', sans-serif">全部取下</button></div>
      </div>
      <p style="margin: 0 4px; font-size: 11px; color: rgba(255,255,255,0.55)">单击绳上的图片放大，可用画笔、箭头、马赛克等标注；双击复制；拖到其他应用可直接使用。取下不会从历史中删除。</p>
    </main>
  </div>
</div>
