<!doctype html>
<html lang="zh-Hans">
<head>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7cb8ff}a:hover{color:#a6cfff}
</style>
</helmet>
<div style="width: 900px; height: 920px; box-sizing: border-box; padding: 30px; position: relative; overflow: hidden; background: #0d1222; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; color: rgba(255,255,255,0.94); -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; left: -160px; top: -140px; width: 620px; height: 560px; border-radius: 50%; background: #3d4fe0; opacity: 0.7; filter: blur(120px)"></div>
  <div aria-hidden="true" style="position: absolute; right: -180px; bottom: -160px; width: 600px; height: 520px; border-radius: 50%; background: #11a7a0; opacity: 0.5; filter: blur(130px)"></div>
  <div style="position: relative; width: 840px; height: 860px; display: flex; border-radius: 18px; overflow: hidden; background: rgba(26,27,35,0.82); backdrop-filter: blur(40px) saturate(1.8); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 90px rgba(4,6,20,0.6), inset 0 1px 0 rgba(255,255,255,0.16)">
    <aside style="width: 200px; flex: none; padding: 44px 10px 10px; background: rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4"><circle cx="9" cy="9" r="2.4"></circle><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4"></path></svg>通用</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; background: #0A84FF; color: #fff"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>历史</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"><path d="M2 6V3.5A1.5 1.5 0 0 1 3.5 2H6M12 2h2.5A1.5 1.5 0 0 1 16 3.5V6M16 12v2.5a1.5 1.5 0 0 1-1.5 1.5H12M6 16H3.5A1.5 1.5 0 0 1 2 14.5V12"></path><circle cx="9" cy="9" r="2.6"></circle></svg>截图与标注</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h6M5 2v1.5M3.2 3.5c.4 2.5 2 4.3 4.3 5M6.8 3.5C6.4 6 4.6 7.9 2.2 8.8M8.5 14l2.8-6.5L14 14M9.4 12h3.8"></path></svg>翻译</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5l5.5 2v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z"></path><path d="M5.6 8l1.7 1.7 3.2-3.2" stroke-linecap="round"></path></svg>剪贴板安全</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7.5" rx="1.6"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>隐私</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: rgba(255,255,255,0.85)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 7.2v4M8 4.8v.1"></path></svg>关于</div>
    </aside>
    <main style="flex: 1; min-width: 0; padding: 22px 28px; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0 0 6px; font-size: 15px; font-weight: 600">历史</h1>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px">
        <div style="padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07)"><div style="font-size: 11px; color: rgba(255,255,255,0.55)">条目</div><div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">128</div><div style="font-size: 11px; color: rgba(255,255,255,0.55)">其中收藏 9</div></div>
        <div style="padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07)"><div style="font-size: 11px; color: rgba(255,255,255,0.55)">占用空间</div><div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">46 MB</div><div style="font-size: 11px; color: rgba(255,255,255,0.55)">图片 41 MB</div></div>
        <div style="padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07)"><div style="font-size: 11px; color: rgba(255,255,255,0.55)">晾衣绳</div><div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">4 / 12</div><div style="font-size: 11px; color: rgba(255,255,255,0.55)">挂着的不会被清理</div></div>
      </div>

      <h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6)">保留</h2>
      <div style="border-radius: 10px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.07)">
        <div style="display: flex; align-items: center; padding: 10px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">最多保留
          <select aria-label="最多保留" style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; font: 12px -apple-system, 'PingFang SC', sans-serif"><option>500 条</option></select></div>
        <div style="display: flex; align-items: center; padding: 10px 14px; font-size: 13px; border-bottom: 0.5px solid rgba(255,255,255,0.07)">自动清理早于
          <select aria-label="自动清理" style="margin-left: auto; height: 24px; padding: 0 8px; border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; font: 12px -apple-system, 'PingFang SC', sans-serif"><option>从不</option></select></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 13px">
          <div style="display: flex; flex-direction: column; gap: 2px">按图中文字搜索图片<span style="font-size: 11px; color: rgba(255,255,255,0.55)">在本机识别，不会上传</span></div>
          <label style="margin-left: auto; position: relative; width: 38px; height: 22px; flex: none"><input type="checkbox" checked aria-label="按图中文字搜索图片" style="position: absolute; inset: 0; opacity: 0; margin: 0"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 11px; background: #0A84FF"></span><span aria-hidden="true" style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff"></span></label>
        </div>
      </div>
      <p style="margin: 0 4px 6px; font-size: 11px; color: rgba(255,255,255,0.55)">收藏和晾衣绳上的图片永远不会被自动清理。</p>

      <h2 style="margin: 4px 4px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6)">存储</h2>
      <div style="border-radius: 10px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.07); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div aria-label="占用比例" role="img" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,0.08)"><span style="width: 62%; background: #ff9f0a"></span><span style="width: 6%; background: #0A84FF"></span><span style="width: 2%; background: #30d158"></span></div>
        <div style="display: flex; gap: 16px; font-size: 11px; color: rgba(255,255,255,0.65)"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #ff9f0a"></span>图片 41 MB</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #0A84FF"></span>文本与富文本 4 MB</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #30d158"></span>译文缓存 1 MB</span></div>
        <div style="display: flex; gap: 8px">
          <button style="height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: rgba(255,255,255,0.1); color: #fff; font: 12px -apple-system, 'PingFang SC', sans-serif">在访达中显示</button>
          <button style="margin-left: auto; height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: rgba(255,69,58,0.18); color: #ff8a80; font: 600 12px -apple-system, 'PingFang SC', sans-serif">清空历史…</button>
        </div>
      </div>
      <p style="margin: 0 4px; font-size: 11px; color: rgba(255,255,255,0.55)">历史只保存在本机，并排除在 Time Machine 备份之外。</p>
    </main>
  </div>
</div>
</x-dc>
