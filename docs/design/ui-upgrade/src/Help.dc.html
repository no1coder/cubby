<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>快捷键帮助</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7cb8ff}a:hover{color:#a6cfff}
</style>
</helmet>
<div style="width: 760px; height: 780px; position: relative; overflow: hidden; background: #0d1222; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; color: rgba(255,255,255,0.94); -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; left: -160px; top: -140px; width: 620px; height: 560px; border-radius: 50%; background: #3d4fe0; opacity: 0.75; filter: blur(110px)"></div>
  <div aria-hidden="true" style="position: absolute; right: -180px; top: 60px; width: 520px; height: 460px; border-radius: 50%; background: #f07a45; opacity: 0.55; filter: blur(120px)"></div>
  <div aria-hidden="true" style="position: absolute; left: 80px; bottom: -220px; width: 640px; height: 480px; border-radius: 50%; background: #11a7a0; opacity: 0.55; filter: blur(120px)"></div>

  <section aria-label="Cubby 面板 · 帮助" style="position: absolute; left: 190px; top: 56px; width: 380px; height: 668px; box-sizing: border-box; border-radius: 22px; background: rgba(24,25,33,0.58); backdrop-filter: blur(40px) saturate(1.8); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 90px rgba(4,6,20,0.6), inset 0 1px 0 rgba(255,255,255,0.18); overflow: hidden">
    <div aria-hidden="true" style="padding: 14px; display: flex; flex-direction: column; gap: 10px; opacity: 0.35">
      <span style="height: 36px; border-radius: 12px; background: rgba(255,255,255,0.08)"></span>
      <span style="height: 34px; border-radius: 12px; background: rgba(0,0,0,0.22)"></span>
      <span style="height: 90px; border-radius: 15px; background: rgba(255,255,255,0.09)"></span>
      <span style="height: 70px; border-radius: 15px; background: rgba(255,255,255,0.09)"></span>
      <span style="height: 120px; border-radius: 15px; background: rgba(255,255,255,0.09)"></span>
    </div>
    <div role="dialog" aria-label="键盘快捷键" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(14,15,22,0.72); backdrop-filter: blur(18px)">
      <header style="display: flex; align-items: center; padding: 18px 18px 8px">
        <b style="font-size: 15px; font-weight: 700">键盘快捷键</b>
        <button aria-label="关闭帮助 esc" style="margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 10 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
      </header>
      <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 6px 18px 12px; font-size: 12.5px">
        <div style="display: flex; flex-direction: column; gap: 7px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: rgba(255,255,255,0.5)">选择与粘贴</span>
          <div style="display: flex; align-items: center">选择<span style="margin-left: auto; display: flex; gap: 4px"><kbd style="font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">↑↓</kbd><kbd style="font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">←→</kbd></span></div>
          <div style="display: flex; align-items: center">粘贴到当前应用<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">↩</kbd></div>
          <div style="display: flex; align-items: center">纯文本粘贴<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⇧↩</kbd></div>
          <div style="display: flex; align-items: center">仅复制<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘↩</kbd></div>
          <div style="display: flex; align-items: center">快速粘贴前九条<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘1 – ⌘9</kbd></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: rgba(255,255,255,0.5)">查看与整理</span>
          <div style="display: flex; align-items: center">预览<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">空格</kbd></div>
          <div style="display: flex; align-items: center">切换分类<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⇥</kbd></div>
          <div style="display: flex; align-items: center">收藏<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘P</kbd></div>
          <div style="display: flex; align-items: center">删除 / 撤销<span style="margin-left: auto; display: flex; gap: 4px"><kbd style="font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘⌫</kbd><kbd style="font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘Z</kbd></span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: rgba(255,255,255,0.5)">图片<span style="padding: 1px 6px; border-radius: 999px; background: rgba(10,132,255,0.3); color: #a6cfff; font-size: 10px">新</span></span>
          <div style="display: flex; align-items: center">只看图片（全局）<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌃⇧V</kbd></div>
          <div style="display: flex; align-items: center">挂到 / 取下晾衣绳<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘L</kbd></div>
          <div style="display: flex; align-items: center">显示晾衣绳（全局）<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌃⌥T</kbd></div>
          <div style="display: flex; align-items: center">贴到屏幕<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⇧⌘P</kbd></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: rgba(255,255,255,0.5)">翻译</span>
          <div style="display: flex; align-items: center">打开翻译卡<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌘T</kbd></div>
          <div style="display: flex; align-items: center">翻译后粘贴<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">⌥↩</kbd></div>
          <div style="display: flex; align-items: center">按住预览译文<kbd style="margin-left: auto; font: 600 11px -apple-system, sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12)">按住 ⌥</kbd></div>
        </div>
      </div>
      <footer style="display: flex; align-items: center; padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px">
        <a href="#guide" style="text-decoration: none">完整使用说明…</a>
        <span style="margin-left: auto; color: rgba(255,255,255,0.5)">按 esc 关闭</span>
      </footer>
    </div>
  </section>
</div>
</x-dc>

</html>
