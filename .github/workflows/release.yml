# 发布：推送 v* tag → 测试门禁 → Developer ID 签名 → 公证 .app / DMG 并 staple
#       → 构建来源证明 → 创建 draft release（维护者冒烟后手动 Publish，触发 publish.yml）
#
# 所需配置（全部绑定 GitHub Environment "release"，需维护者审批，详见 docs/RELEASING.md）：
#   secrets：DEVELOPER_ID_P12_BASE64、DEVELOPER_ID_P12_PASSWORD、KEYCHAIN_PASSWORD、
#            NOTARY_KEY_P8_BASE64、NOTARY_KEY_ID、NOTARY_ISSUER_ID
#   vars（可选）：SIGN_IDENTITY（留空则自动选用钥匙串中的 Developer ID Application 证书）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# bash --noprofile --norc -eo pipefail
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26"

jobs:
  release:
    name: Build, notarize & draft release
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write # 创建 draft release
      id-token: write # 构建来源证明（Sigstore OIDC）
      attestations: write # 构建来源证明
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 完整历史：CFBundleVersion = git rev-list --count HEAD
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh

      - name: Verify tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME 与 VERSION 文件（$FILE_VERSION）不一致"
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Test (gate)
        run: swift test

      - name: Import signing certificate and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: ./scripts/ci/signing-keychain.sh import

      - name: Build, sign, notarize and package
        env:
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_TIMEOUT: 45m # .app 与 DMG 各提交一次，两次合计需小于 job 超时
          # NOTARY_KEY_PATH 由上一步写入 $GITHUB_ENV
        run: ./scripts/release.sh

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Cubby-*.dmg
            dist/Cubby-*.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Cubby-$VERSION.dmg" "dist/Cubby-$VERSION.zip" dist/SHA256SUMS.txt \
            --draft --verify-tag \
            --title "Cubby $VERSION" \
            --notes-file dist/NOTES.md \
            ${flags[@]+"${flags[@]}"}

      - name: Remove signing material
        if: always()
        run: ./scripts/ci/signing-keychain.sh cleanup
