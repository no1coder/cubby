version: 2
updates:
  # 仅更新 GitHub Actions（应用本体无第三方依赖）；workflow 中的 action 固定到 commit SHA，Dependabot 会连同版本注释一起更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
